services:

  # ── ML Backend (FastAPI + LangChain agents + 393 handlers) ──────────────────
  ml-backend:
    build:
      context: ../ml-datascience
    container_name: ds-agent-backend
    ports:
      - "8000:8000"
    volumes:
      # Hot reload: only source dir — installed packages stay in image layer
      - ../ml-datascience/api:/app/api
    env_file:
      - ../ml-datascience/api/.env   # ANTHROPIC_API_KEY, OPENAI_API_KEY, LOG_LEVEL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Web App (Next.js + Prisma + NextAuth) ───────────────────────────────────
  web-app:
    build:
      context: ../web-app
    container_name: ds-agent-frontend
    ports:
      - "3000:3000"
    volumes:
      # Hot reload: mount source directories
      - ../web-app/src:/app/src
      - ../web-app/public:/app/public
      - ../web-app/prisma:/app/prisma   # SQLite db persisted on host
    environment:
      # Override localhost → Docker service name
      - ML_BACKEND_URL=http://ml-backend:8000
      - DATABASE_URL=file:./prisma/dev.db
    env_file:
      - ../web-app/.env.local   # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, AUTH_SECRET
    depends_on:
      ml-backend:
        condition: service_healthy
    restart: unless-stopped
